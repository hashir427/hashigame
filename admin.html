<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Multi-Avatar Admin</title>
<style>
  body{font-family:Arial,sans-serif;background:#12161f;color:#eee;margin:0;padding:16px}
  .box{max-width:680px;margin:0 auto}
  .card{background:#1e2433;border-radius:12px;padding:18px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.08)}
  h1{font-size:24px;color:#ffc107;margin-top:0} h3{margin:0 0 12px;color:#90caf9}
  input[type=email],input[type=password],input[type=text]{width:100%;box-sizing:border-box;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #333;background:#0d1117;color:#fff;font-size:15px}
  button{padding:10px 20px;border:0;border-radius:8px;background:#ffc107;color:#111;font-weight:bold;font-size:14px;cursor:pointer;margin:4px 4px 0 0}
  button.red{background:#e53935;color:#fff} button.green{background:#2e7d32;color:#fff} button.grey{background:#444;color:#fff}
  .avatar-item{display:flex;align-items:center;justify-content:space-between;background:#161a24;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #2d3748}
  .avatar-item.active-item{border:2px solid #00e676}
  .avatar-thumb{width:60px;height:80px;object-fit:contain;background:#000;border-radius:6px;margin-right:12px}
  .avatar-meta{flex-grow:1}
  .sound-group{background:#161b26;padding:12px;border-radius:8px;margin-bottom:10px}
  .sound-group label{font-size:13px;display:block;margin-bottom:4px;color:#ffc107}
  #msg{font-weight:bold;margin:10px 0}
  .hidden{display:none}
</style>
</head>
<body>
<div class="box">
  <h1>🔧 Multi-Avatar Admin Manager</h1>
  <div id="msg"></div>

  <div id="loginCard" class="card">
    <h3>Admin Login</h3>
    <input id="em" type="email" placeholder="Admin email">
    <input id="pw" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>

  <div id="panel" class="hidden">
    <!-- Existing Avatars List -->
    <div class="card">
      <h3>🎭 Saved Avatars</h3>
      <div id="avatarList">Loading avatars...</div>
    </div>

    <!-- Create New Avatar Form -->
    <div class="card">
      <h3>➕ Naya Avatar Add Karein</h3>
      <input type="text" id="newAvName" placeholder="Avatar ka Naam (e.g. Hero, Politician, Runner)">
      
      <div style="margin-bottom:14px;">
        <label style="display:block;margin-bottom:6px;font-size:14px;">👤 Avatar Image (PNG with transparent bg):</label>
        <input type="file" id="newAvImg" accept="image/png,image/webp,image/*">
      </div>

      <div class="sound-group">
        <label>🚗 Car Collision Sound (MP3):</label>
        <input type="file" id="snd_car" accept="audio/*">
      </div>

      <div class="sound-group">
        <label>🪵 Wood Barrier Sound (MP3):</label>
        <input type="file" id="snd_wood" accept="audio/*">
      </div>

      <div class="sound-group">
        <label>🪧 Signboard Sound (MP3):</label>
        <input type="file" id="snd_signboard" accept="audio/*">
      </div>

      <div class="sound-group">
        <label>🪙 Coin Collect Sound (MP3):</label>
        <input type="file" id="snd_coin" accept="audio/*">
      </div>

      <button id="saveAvatarBtn" class="green">Save Naya Avatar</button>
    </div>

    <div class="card">
      <button class="grey" id="logoutBtn">Logout</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const msg = (t, bad) => { $('msg').textContent = t; $('msg').style.color = bad ? '#ff6b6b' : '#00e676'; };

let avatars = [];

async function uploadFile(file, folder){
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${folder}/${Date.now()}-${safe}`;
  const { error } = await sb.storage.from('game-assets').upload(path, file, { upsert: false, contentType: file.type });
  if(error) throw error;
  return sb.storage.from('game-assets').getPublicUrl(path).data.publicUrl;
}

async function loadAvatars(){
  const { data, error } = await sb.from('avatars').select('*').order('id', { ascending: true });
  if(error) return msg('Error loading avatars: ' + error.message, true);
  avatars = data || [];
  renderAvatarList();
}

function renderAvatarList(){
  const container = $('avatarList');
  if(avatars.length === 0){
    container.innerHTML = '<p style="opacity:0.7;">Koi avatar nahi hai. Niche form se add karein.</p>';
    return;
  }
  container.innerHTML = '';
  avatars.forEach(av => {
    const div = document.createElement('div');
    div.className = 'avatar-item' + (av.is_active ? ' active-item' : '');
    div.innerHTML = `
      <img src="${av.image_url || 'pic.png'}" class="avatar-thumb" alt="">
      <div class="avatar-meta">
        <strong style="font-size:16px;">${av.name}</strong> ${av.is_active ? '<span style="color:#00e676;font-size:12px;">(Active Game Default)</span>' : ''}
        <div style="font-size:12px;opacity:0.75;margin-top:4px;">
          🚗 ${av.sound_car ? 'Custom' : 'Default'} | 🪵 ${av.sound_wood ? 'Custom' : 'Default'} | 🪧 ${av.sound_signboard ? 'Custom' : 'Default'} | 🪙 ${av.sound_coin ? 'Custom' : 'Default'}
        </div>
      </div>
      <div>
        ${!av.is_active ? `<button class="green" onclick="setActiveAvatar(${av.id})">Set Active</button>` : ''}
        <button class="red" onclick="deleteAvatar(${av.id})">Delete</button>
      </div>
    `;
    container.appendChild(div);
  });
}

window.setActiveAvatar = async function(id){
  msg('Setting active avatar...');
  await sb.from('avatars').update({ is_active: false }).neq('id', 0);
  await sb.from('avatars').update({ is_active: true }).eq('id', id);
  msg('Active avatar set ho gaya ✅');
  await loadAvatars();
};

window.deleteAvatar = async function(id){
  if(!confirm('Is avatar ko delete karna chahte hain?')) return;
  const { error } = await sb.from('avatars').delete().eq('id', id);
  if(error) return msg('Delete error: ' + error.message, true);
  msg('Avatar delete ho gaya.');
  await loadAvatars();
};

$('saveAvatarBtn').onclick = async () => {
  const name = $('newAvName').value.trim() || 'Player Avatar';
  const imgFile = $('newAvImg').files[0];
  if(!imgFile) return msg('Meharbani karke Avatar Image select karein!', true);

  try {
    msg('Uploading avatar aur audio files...');
    const imgUrl = await uploadFile(imgFile, 'avatars');
    
    let carUrl = '', woodUrl = '', signUrl = '', coinUrl = '';
    if($('snd_car').files[0]) carUrl = await uploadFile($('snd_car').files[0], 'sounds');
    if($('snd_wood').files[0]) woodUrl = await uploadFile($('snd_wood').files[0], 'sounds');
    if($('snd_signboard').files[0]) signUrl = await uploadFile($('snd_signboard').files[0], 'sounds');
    if($('snd_coin').files[0]) coinUrl = await uploadFile($('snd_coin').files[0], 'sounds');

    const isFirst = avatars.length === 0;
    const { error } = await sb.from('avatars').insert({
      name,
      image_url: imgUrl,
      sound_car: carUrl,
      sound_wood: woodUrl,
      sound_signboard: signUrl,
      sound_coin: coinUrl,
      is_active: isFirst
    });

    if(error) throw error;
    msg('Naya avatar kamyabi se save ho gaya ✅');
    $('newAvName').value = '';$('newAvImg').value = '';
    $('snd_car').value = '';$('snd_wood').value = '';
    $('snd_signboard').value = '';$('snd_coin').value = '';
    await loadAvatars();
  } catch(err) {
    msg('Upload Error: ' + err.message, true);
  }
};

$('loginBtn').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password:$('pw').value });
  if(error) return msg('Login fail: ' + error.message, true);
  msg('Login ho gaya ✅');
  $('loginCard').classList.add('hidden');$('panel').classList.remove('hidden');
  await loadAvatars();
};

$('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
  $('panel').classList.add('hidden');$('loginCard').classList.remove('hidden');
};

sb.auth.getSession().then(({ data }) => {
  if(data?.session){
    $('loginCard').classList.add('hidden');$('panel').classList.remove('hidden');
    loadAvatars();
  }
});
</script>
</body>
</html>
